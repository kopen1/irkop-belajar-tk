name: Build Native Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      # Never silently create a new signing certificate. A different key makes
      # Android reject an APK as an update to the installed application.
      - name: Restore stable Android signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: irkop-android-debug-keystore-v1

      - name: Verify stable Android signing key
        shell: bash
        run: |
          test -f "$HOME/.android/debug.keystore" || {
            echo "ERROR: Stable signing key cache is missing. Refusing to build an APK with a new key."
            exit 1
          }
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E 'Alias name:|SHA256:'

      - name: Prepare native Android platform
        run: flutter create . --platforms android --org com.irkop

      - name: Lock release signing configuration
        shell: bash
        run: |
          cp "$HOME/.android/debug.keystore" android/app/irkop-release.keystore
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          marker = 'buildTypes {\n'
          if marker not in s:
              raise SystemExit('ERROR: Flutter Android template changed; release signing was not locked.')
          signing = '''signingConfigs {\n        create("irkopRelease") {\n            storeFile = file("irkop-release.keystore")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }\n\n    '''
          if 'create("irkopRelease")' not in s:
              s = s.replace(marker, signing + marker, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("irkopRelease")')
          if 'signingConfig = signingConfigs.getByName("irkopRelease")' not in s:
              s = s.replace(marker, marker + '        release {\n            signingConfig = signingConfigs.getByName("irkopRelease")\n        }\n', 1)
          p.write_text(s)
          PY

      - name: Install native Android music bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/kotlin/com/irkop/irkop_belajar_tk
          cat > android/app/src/main/kotlin/com/irkop/irkop_belajar_tk/MainActivity.kt <<'KOTLIN'
          package com.irkop.irkop_belajar_tk

          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioManager
          import android.media.AudioTrack
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import kotlin.math.PI
          import kotlin.math.sin

          class MainActivity : FlutterActivity() {
              private val channelName = "irkop/background_music"
              private var player: ExplorerMusicPlayer? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "start" -> {
                                  val volume = (call.argument<Double>("volume") ?: 0.65).toFloat()
                                  if (player == null) player = ExplorerMusicPlayer()
                                  player?.start(volume)
                                  result.success(null)
                              }
                              "stop" -> {
                                  player?.stop()
                                  result.success(null)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              override fun onDestroy() {
                  player?.stop()
                  player = null
                  super.onDestroy()
              }
          }

          private class ExplorerMusicPlayer {
              private val sampleRate = 44100
              private val notes = doubleArrayOf(261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23)
              private var track: AudioTrack? = null
              @Volatile private var running = false
              private var thread: Thread? = null

              fun start(volume: Float) {
                  if (running) {
                      track?.setVolume(volume.coerceIn(0f, 1f))
                      return
                  }

                  val minBuffer = AudioTrack.getMinBufferSize(
                      sampleRate,
                      AudioFormat.CHANNEL_OUT_MONO,
                      AudioFormat.ENCODING_PCM_16BIT
                  )
                  val bufferSize = maxOf(minBuffer, sampleRate / 2)
                  track = AudioTrack.Builder()
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_GAME)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build()
                      )
                      .setAudioFormat(
                          AudioFormat.Builder()
                              .setSampleRate(sampleRate)
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .build()
                      )
                      .setBufferSizeInBytes(bufferSize)
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .build()
                  track?.setVolume(volume.coerceIn(0f, 1f))
                  track?.play()
                  running = true

                  thread = Thread {
                      var index = 0
                      val samplesPerNote = (sampleRate * 0.42).toInt()
                      val buffer = ShortArray(samplesPerNote)
                      while (running) {
                          val frequency = notes[index]
                          for (i in buffer.indices) {
                              val phase = i.toDouble() / sampleRate
                              val attack = (i / (sampleRate * 0.025)).coerceAtMost(1.0)
                              val release = ((buffer.lastIndex - i) / (sampleRate * 0.06)).coerceAtMost(1.0)
                              val envelope = minOf(attack, release)
                              buffer[i] = (sin(2.0 * PI * frequency * phase) * 12000.0 * envelope).toInt().toShort()
                          }
                          try {
                              track?.write(buffer, 0, buffer.size)
                          } catch (_: Exception) {
                              break
                          }
                          index = (index + 1) % notes.size
                      }
                  }.also { it.start() }
              }

              fun stop() {
                  running = false
                  thread?.interrupt()
                  thread = null
                  try { track?.stop() } catch (_: Exception) {}
                  try { track?.release() } catch (_: Exception) {}
                  track = null
              }
          }
          KOTLIN

      - name: Flutter Pub Get
        run: flutter pub get

      # Tests are intentionally skipped. Analyze only application source so
      # obsolete test-only files cannot block a release APK build.
      - name: Flutter Analyze app source
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --build-name=1.0.2 --build-number=${{ github.run_number }} --tree-shake-icons

      - name: Verify APK identity and signing
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          EXPECTED_CERT=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apk-signing.txt
          ACTUAL_CERT=$(awk '/certificate SHA-256 digest:/{print $NF; exit}' /tmp/apk-signing.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$EXPECTED_CERT" || { echo "ERROR: signing key fingerprint could not be read"; exit 1; }
          test "$ACTUAL_CERT" = "$EXPECTED_CERT" || {
            echo "ERROR: APK was signed with a different certificate"
            echo "Expected: $EXPECTED_CERT"
            echo "Actual:   $ACTUAL_CERT"
            exit 1
          }

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/irkop-belajar-tk_v1.0.2.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: irkop-belajar-tk_v1.0.2-apk
          path: dist/irkop-belajar-tk_v1.0.2.apk
          compression-level: 9
          retention-days: 30

      - name: Publish direct APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-build-${{ github.run_number }}
          name: IRKOP Belajar TK v1.0.2 (Build ${{ github.run_number }})
          generate_release_notes: true
          files: dist/irkop-belajar-tk_v1.0.2.apk
