name: Build Native Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Prepare stable Android signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Cache Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: irkop-android-debug-keystore-v1

      - name: Prepare native Android platform
        run: flutter create . --platforms android --org com.irkop

      - name: Install native Android music bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/kotlin/com/irkop/irkop_belajar_tk
          cat > android/app/src/main/kotlin/com/irkop/irkop_belajar_tk/MainActivity.kt <<'KOTLIN'
          package com.irkop.irkop_belajar_tk

          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioManager
          import android.media.AudioTrack
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import kotlin.math.PI
          import kotlin.math.sin

          class MainActivity : FlutterActivity() {
              private val channelName = "irkop/background_music"
              private var player: ExplorerMusicPlayer? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "start" -> {
                                  val volume = (call.argument<Double>("volume") ?: 0.65).toFloat()
                                  if (player == null) player = ExplorerMusicPlayer()
                                  player?.start(volume)
                                  result.success(null)
                              }
                              "stop" -> {
                                  player?.stop()
                                  result.success(null)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              override fun onDestroy() {
                  player?.stop()
                  player = null
                  super.onDestroy()
              }
          }

          private class ExplorerMusicPlayer {
              private val sampleRate = 44100
              private val notes = doubleArrayOf(261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23)
              private var track: AudioTrack? = null
              @Volatile private var running = false
              private var thread: Thread? = null

              fun start(volume: Float) {
                  if (running) {
                      track?.setVolume(volume.coerceIn(0f, 1f))
                      return
                  }

                  val minBuffer = AudioTrack.getMinBufferSize(
                      sampleRate,
                      AudioFormat.CHANNEL_OUT_MONO,
                      AudioFormat.ENCODING_PCM_16BIT
                  )
                  val bufferSize = maxOf(minBuffer, sampleRate / 2)
                  track = AudioTrack.Builder()
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_GAME)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build()
                      )
                      .setAudioFormat(
                          AudioFormat.Builder()
                              .setSampleRate(sampleRate)
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .build()
                      )
                      .setBufferSizeInBytes(bufferSize)
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .build()
                  track?.setVolume(volume.coerceIn(0f, 1f))
                  track?.play()
                  running = true

                  thread = Thread {
                      var index = 0
                      val samplesPerNote = (sampleRate * 0.42).toInt()
                      val buffer = ShortArray(samplesPerNote)
                      while (running) {
                          val frequency = notes[index]
                          for (i in buffer.indices) {
                              val phase = i.toDouble() / sampleRate
                              val attack = (i / (sampleRate * 0.025)).coerceAtMost(1.0)
                              val release = ((buffer.lastIndex - i) / (sampleRate * 0.06)).coerceAtMost(1.0)
                              val envelope = minOf(attack, release)
                              buffer[i] = (sin(2.0 * PI * frequency * phase) * 12000.0 * envelope).toInt().toShort()
                          }
                          try {
                              track?.write(buffer, 0, buffer.size)
                          } catch (_: Exception) {
                              break
                          }
                          index = (index + 1) % notes.size
                      }
                  }.also { it.start() }
              }

              fun stop() {
                  running = false
                  thread?.interrupt()
                  thread = null
                  try { track?.stop() } catch (_: Exception) {}
                  try { track?.release() } catch (_: Exception) {}
                  track = null
              }
          }
          KOTLIN

      - name: Flutter Pub Get
        run: flutter pub get

      # Tests are intentionally skipped. Analyze only application source so
      # obsolete test-only files cannot block a release APK build.
      - name: Flutter Analyze app source
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --build-name=1.0.2 --build-number=${{ github.run_number }} --tree-shake-icons

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/irkop-belajar-tk_v1.0.2.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: irkop-belajar-tk_v1.0.2-apk
          path: dist/irkop-belajar-tk_v1.0.2.apk
          compression-level: 9
          retention-days: 30

      - name: Publish direct APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-build-${{ github.run_number }}
          name: IRKOP Belajar TK v1.0.2 (Build ${{ github.run_number }})
          generate_release_notes: true
          files: dist/irkop-belajar-tk_v1.0.2.apk
