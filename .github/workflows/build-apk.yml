name: Build Native Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Prepare stable Android signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Cache Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: irkop-android-debug-keystore-v1

      # This creates a real Android project and compiles Flutter to a native
      # Android APK. No WebView and no Flutter Web build are involved here.
      - name: Prepare native Android platform
        run: flutter create . --platforms android --org com.irkop

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Tests intentionally skipped to keep APK iteration fast.
      - name: Build release APK
        run: flutter build apk --release --build-name=1.0.2 --build-number=${{ github.run_number }} --tree-shake-icons

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/irkop-belajar-tk_v1.0.2.apk"

      # GitHub Actions artifacts are always downloaded as ZIP archives.
      # Publish the APK as a Release asset as well, so the user gets the
      # actual .apk file directly without an artifact ZIP wrapper.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: irkop-belajar-tk_v1.0.2-apk
          path: dist/irkop-belajar-tk_v1.0.2.apk
          compression-level: 9
          retention-days: 30

      - name: Publish direct APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-build-${{ github.run_number }}
          name: IRKOP Belajar TK v1.0.2 (Build ${{ github.run_number }})
          generate_release_notes: true
          files: dist/irkop-belajar-tk_v1.0.2.apk
