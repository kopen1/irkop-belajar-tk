name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (cached)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Rive generator npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: rive-generator-npm-${{ runner.os }}-${{ hashFiles('tool/generate_rive_cards.mjs') }}
          restore-keys: |
            rive-generator-npm-${{ runner.os }}-

      - name: Build Rive generator
        run: |
          rm -rf /tmp/rive-mcp
          git clone --depth 1 https://github.com/ODU33104/rive-mcp.git /tmp/rive-mcp
          cd /tmp/rive-mcp
          npm ci
          npm run build

      - name: Generate all 8 Rive world cards
        run: node tool/generate_rive_cards.mjs

      - name: Commit generated Rive assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rive/*.riv
          if git diff --cached --quiet; then
            echo "Rive assets are already current."
          else
            git commit -m "chore(rive): bundle 8 interactive world cards"
            git push
          fi

      - name: Setup Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Flutter Pub Get
        run: flutter pub get
      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # Tests are intentionally skipped for the fast release/deploy path.
      - name: Configure Flutter Web
        run: flutter create . --platforms web
      - name: Build Flutter Web
        run: flutter build web --release --base-href "/irkop-belajar-tk/"
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
