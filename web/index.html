<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2495D2">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Belajar TK</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d91cf;font-family:Arial,sans-serif}
    #startup-splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:linear-gradient(#2097d5 0%,#72c9e9 55%,#78c74a 56%,#168a59 100%);transition:opacity .35s ease}
    .scene{width:min(92vw,430px);height:min(94vh,760px);border-radius:32px;position:relative;overflow:hidden;box-shadow:0 10px 35px #064e7a66;background:linear-gradient(#2d9bd4,#8bd7ed 52%,#8bd54b 53%,#178d58 100%)}
    .rainbow{position:absolute;width:280px;height:150px;left:50%;top:42px;transform:translateX(-50%);border:18px solid #ff5650;border-bottom:0;border-radius:280px 280px 0 0;box-sizing:border-box}
    .rainbow:before{content:"";position:absolute;inset:14px 14px 0;border:17px solid #ffcf31;border-bottom:0;border-radius:240px 240px 0 0}
    .rainbow:after{content:"";position:absolute;inset:31px 31px 0;border:16px solid #48bf64;border-bottom:0;border-radius:210px 210px 0 0}
    .sun{position:absolute;right:30px;top:30px;width:78px;height:78px;border-radius:50%;background:#ffd92a;box-shadow:0 0 0 13px #ffc51f55;display:grid;place-items:center;font-size:34px}
    .cloud{position:absolute;background:#fffdf7dd;border-radius:999px;width:130px;height:45px;left:-20px;top:105px;box-shadow:35px -15px 0 5px #fffdf7dd,70px 3px 0 -2px #fffdf7dd}
    .title{position:absolute;left:0;right:0;top:180px;text-align:center;font-weight:900;font-size:clamp(44px,12vw,68px);letter-spacing:-3px;color:#fff;text-shadow:5px 5px 0 #064b9b,0 0 9px #064b9b}
    .tag{position:absolute;left:50%;transform:translateX(-50%);top:260px;width:78%;padding:12px 8px;text-align:center;border-radius:18px;background:linear-gradient(#ffe66d,#ffb916);border:3px solid #f28b00;color:#842600;font-size:clamp(16px,4.5vw,23px);font-weight:900;white-space:nowrap}
    .panda{position:absolute;left:50%;transform:translateX(-50%);bottom:105px;width:220px;height:245px;border-radius:48% 48% 44% 44%;background:#20242b;box-shadow:inset 0 0 0 8px #111}
    .panda:before{content:"🐼";position:absolute;inset:-55px -25px 15px;font-size:250px;line-height:1;filter:drop-shadow(0 5px 2px #0004)}
    .cap{position:absolute;left:50%;transform:translateX(-50%);bottom:290px;font-size:78px;z-index:2}
    .start{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;width:70%;height:76px;border-radius:38px;background:linear-gradient(#ffe36c,#ffad0c);border:4px solid #f28b00;box-shadow:0 6px 0 #b36a00;color:#fff;text-shadow:2px 2px 0 #7d3100;display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(23px,6vw,32px);font-weight:900}
    .flower{position:absolute;font-size:42px}.f1{left:18px;bottom:120px}.f2{right:22px;bottom:120px}.f3{left:35px;bottom:40px}.f4{right:35px;bottom:50px}
  </style>
</head>
<body>
  <div id="startup-splash" aria-label="Belajar TK sedang dimuat">
    <div class="scene">
      <div class="sun">😊</div><div class="cloud"></div><div class="rainbow"></div>
      <div class="title">BELAJAR TK</div>
      <div class="tag">Ayo Bermain &amp; Belajar Bersama!</div>
      <div class="cap">🧢</div><div class="panda"></div>
      <div class="flower f1">🌸</div><div class="flower f2">🌼</div><div class="flower f3">🌺</div><div class="flower f4">🌻</div>
      <div class="start">▶&nbsp; Memuat...</div>
    </div>
  </div>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));
    if (window.caches) caches.keys().then(k=>k.forEach(x=>caches.delete(x)));
    window.addEventListener('flutter-first-frame',function(){const s=document.getElementById('startup-splash');if(s){s.style.opacity='0';setTimeout(()=>s.remove(),400);}});
  </script>
  <script src="flutter_bootstrap.js?v=20260831-mini-quiz-v3" async></script>
</body>
</html>
