  <meta name="theme-color" content="#46A7E7">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Belajar TK</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #46A7E7; }
  </style>
</head>
<body>
  <script>
    // Bersihkan cache/service worker lama agar GitHub Pages selalu memakai build terbaru.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) { registration.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=20260830-huruf-v2" async></script>
</body>
