name: irkop_belajar_tk
description: Aplikasi bermain sambil belajar untuk anak TK.
publish_to: "none"

version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  confetti: ^0.8.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/quiz_dino_happy.jpg
    - assets/images/quiz_wrong_tiger.jpg
    - assets/images/quiz_correct_dino.jpg
